<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kafe Masa Kartı & QR Standı (Baskıya Hazır)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @page {
      size: A5 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f4ede4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .no-print-toolbar {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-print {
      background: #231e1a;
      color: #faedcd;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 700;
      border: 1px solid #d4a373;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: 0.2s;
    }
    .btn-print:hover {
      background: #d4a373;
      color: #12100e;
    }

    /* Stand Card */
    .stand-card {
      width: 148mm;
      height: 210mm;
      background: #161210;
      color: #faedcd;
      border-radius: 12px;
      padding: 14mm 12mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      border: 3px solid #d4a373;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      text-align: center;
    }

    .inner-border {
      position: absolute;
      inset: 3mm;
      border: 1px solid rgba(212, 163, 115, 0.4);
      border-radius: 8px;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(212, 163, 115, 0.15);
      border: 1px solid rgba(212, 163, 115, 0.4);
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4a373;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #fefae0;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 13px;
      color: #d4a373;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .qr-container {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      border: 3px solid #d4a373;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      margin: 10px 0;
    }

    .qr-container img {
      width: 62mm;
      height: 62mm;
      display: block;
    }

    .instructions-box h3 {
      font-size: 17px;
      font-weight: 700;
      color: #fefae0;
      letter-spacing: 0.5px;
    }

    .instructions-box p {
      font-size: 12px;
      color: #a99985;
      margin-top: 3px;
    }

    .wifi-pill {
      background: #231e1a;
      border: 1px solid rgba(212, 163, 115, 0.3);
      border-radius: 12px;
      padding: 8px 18px;
      width: 100%;
      max-width: 100mm;
      font-size: 11.5px;
      display: flex;
      justify-content: space-around;
      color: #d4a373;
    }

    .wifi-pill strong {
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
    }

    .footer-url {
      font-size: 10.5px;
      color: #8c7e70;
      word-break: break-all;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .no-print-toolbar {
        display: none !important;
      }
      .stand-card {
        box-shadow: none;
        border-radius: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        max-height: 100%;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print-toolbar">
    <button class="btn-print" onclick="window.print()">
      <i class="fa-solid fa-print"></i> Masa Kartını Yazdır (A5 / A6)
    </button>
  </div>

  <div class="stand-card">
    <div class="inner-border"></div>

    <div>
      <div class="badge"><i class="fa-solid fa-mug-saucer"></i> Artisan Cafe & Lounge</div>
      <h1 class="title">AURA COFFEE</h1>
      <div class="subtitle">Dijital Menü</div>
    </div>

    <div class="qr-container">
      <img src="qr_code.png" alt="Aura Coffee QR Menü">
    </div>

    <div class="instructions-box">
      <h3>KAMERANIZ İLE OKUTUNUZ</h3>
      <p>Meyve Suları • Sıcak & Soğuk İçecekler</p>
    </div>

    <div class="wifi-pill">
      <div><i class="fa-solid fa-wifi"></i> Wi-Fi: <strong>AuraCoffee_Guest</strong></div>
      <div>Şifre: <strong>aura2026coffee</strong></div>
    </div>

    <div class="footer-url">
      https://hamzasakci.github.io/kafe-menu/
    </div>
  </div>

</body>
</html>
