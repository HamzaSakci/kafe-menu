<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Coffee — Renkli Masa Kartı &amp; QR Standı (Baskıya Hazır)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @page {
      size: A5 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FAF0E6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .no-print-toolbar {
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-print {
      background: linear-gradient(135deg, #E11D62, #F97316);
      color: #FFFFFF;
      padding: 12px 26px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 800;
      border: none;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(225, 29, 98, 0.3);
      transition: transform 0.2s ease;
    }

    .btn-print:hover {
      transform: translateY(-1px);
    }

    .stand-card {
      width: 148mm;
      height: 210mm;
      background: #FFF8F0;
      background-image:
        radial-gradient(circle at 10% 88%, rgba(255, 119, 51, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 92% 84%, rgba(14, 165, 233, 0.14) 0%, transparent 40%);
      color: #1F162B;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      border: 3px solid #EA580C;
      box-shadow: 0 14px 40px rgba(31, 22, 43, 0.2);
      text-align: center;
    }

    .header-band {
      width: 100%;
      padding: 11mm 10mm 9mm;
      background: linear-gradient(135deg, #E11D62 0%, #F97316 100%);
      color: #FFFFFF;
      border-bottom: 4px solid #FBBF24;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      color: #FFFFFF;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12.5px;
      color: #FFF3D6;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 2px;
    }

    .card-content {
      flex: 1;
      width: 100%;
      padding: 6mm 10mm 7mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .qr-container {
      background: #FFFFFF;
      padding: 12px;
      border-radius: 20px;
      border: 4px solid #EA580C;
      box-shadow: 0 10px 26px rgba(234, 88, 12, 0.16);
    }

    .qr-container img {
      width: 60mm;
      height: 60mm;
      display: block;
    }

    .instructions-box h2 {
      font-size: 17px;
      font-weight: 800;
      color: #1F162B;
      letter-spacing: 0.4px;
    }

    .cat-pills {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .cat-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .cat-pill--meyve {
      background: #FFF0E4;
      color: #BD3E08;
      border: 1px solid #FDBA74;
    }

    .cat-pill--sicak {
      background: #FCE7F3;
      color: #9D174D;
      border: 1px solid #F9A8D4;
    }

    .cat-pill--soguk {
      background: #E0F2FE;
      color: #0369A1;
      border: 1px solid #7DD3FC;
    }

    .wifi-pill {
      background: #FFFFFF;
      border: 2px dashed #0284C7;
      border-radius: 14px;
      padding: 9px 14px;
      width: 100%;
      max-width: 112mm;
      font-size: 11.5px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
      color: #0369A1;
      font-weight: 700;
    }

    .wifi-pill strong {
      color: #1F162B;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }

    .footer-url {
      font-size: 10.5px;
      font-weight: 700;
      color: #C81E56;
      word-break: break-all;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .no-print-toolbar {
        display: none !important;
      }
      .stand-card {
        box-shadow: none;
        border-radius: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        max-height: 100%;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print-toolbar">
    <button type="button" class="btn-print" onclick="window.print()">
      <i class="fa-solid fa-print" aria-hidden="true"></i> Renkli Masa Kartını Yazdır (A5 / A6)
    </button>
  </div>

  <div class="stand-card">
    <div class="header-band">
      <div class="badge"><i class="fa-solid fa-mug-saucer" aria-hidden="true"></i> Artisan Cafe &amp; Lounge</div>
      <h1 class="title">AURA COFFEE</h1>
      <div class="subtitle">Renkli Dijital Menü</div>
    </div>

    <div class="card-content">
      <div class="qr-container">
        <img src="qr_code.png" alt="Aura Coffee QR Menü">
      </div>

      <div class="instructions-box">
        <h2>KAMERANIZ İLE OKUTUNUZ</h2>
        <div class="cat-pills">
          <span class="cat-pill cat-pill--meyve">🍊 Meyve Suları</span>
          <span class="cat-pill cat-pill--sicak">☕ Sıcak İçecekler</span>
          <span class="cat-pill cat-pill--soguk">🧊 Soğuk İçecekler</span>
        </div>
      </div>

      <div class="wifi-pill">
        <div><i class="fa-solid fa-wifi" aria-hidden="true"></i> Wi-Fi: <strong>AuraCoffee_Guest</strong></div>
        <div>Şifre: <strong>aura2026coffee</strong></div>
      </div>

      <div class="footer-url">
        https://hamzasakci.github.io/kafe-menu/
      </div>
    </div>
  </div>

</body>
</html>
